[project]
name = "spermophilus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "openai>=2.8.1",
    "pdf2image>=1.17.0",
    "pillow>=12.0.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-telegram-bot[job-queue]>=22.5",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/F (Standard), I (Imports), B (Bugbear), SIM (Simplify), LOG (Logging)
select = ["E", "F", "I", "B", "SIM", "LOG"]
ignore = []

[tool.ruff.format]
quote-style = "double"
